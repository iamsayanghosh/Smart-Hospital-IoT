<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050" style="background:#0f172a; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="stepGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="stepGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="stepGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="stepGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="shadowFilter" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="alertArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f87171"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="25" width="1540" height="70" rx="12" fill="url(#headerGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadowFilter)"/>
  <text x="55" y="68" fill="#38bdf8" font-size="26" font-weight="700">SMART HOSPITAL IoT SYSTEM — SYSTEM DATAFLOW &amp; WORKFLOW DIAGRAM</text>
  <text x="1200" y="66" fill="#94a3b8" font-size="14" font-weight="500">Autonomous Edge Ingestion &bull; Control Loops &bull; Cloud Synchronization</text>

  <!-- STAGE 1: INGESTION -->
  <rect x="30" y="115" width="360" height="905" rx="12" fill="url(#stepGrad1)" stroke="#2563eb" stroke-width="1.5" filter="url(#shadowFilter)"/>
  <rect x="30" y="115" width="360" height="42" rx="12" fill="#1e3a8a" stroke="#2563eb" stroke-width="1"/>
  <text x="50" y="142" fill="#bfdbfe" font-size="16" font-weight="700">STAGE 1: SENSOR INGESTION</text>

  <g transform="translate(50, 175)">
    <!-- DS18B20 Ingestion -->
    <rect x="0" y="0" width="320" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="12" y="24" fill="#38bdf8" font-size="13" font-weight="700">1. Body Temperature Sensing</text>
    <text x="12" y="44" fill="#f8fafc" font-size="11">&bull; Dallas DS18B20 on GPIO 4 (1-Wire bus)</text>
    <text x="12" y="60" fill="#f8fafc" font-size="11">&bull; Non-blocking FSM (TEMP_IDLE &#8594; CONVERTING)</text>
    <text x="12" y="76" fill="#94a3b8" font-size="10.5">750 ms conversion never halts FreeRTOS scheduler</text>

    <!-- Synthetic PPG -->
    <rect x="0" y="105" width="320" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="12" y="129" fill="#38bdf8" font-size="13" font-weight="700">2. Optical Photoplethysmogram (PPG)</text>
    <text x="12" y="149" fill="#f8fafc" font-size="11">&bull; Optical Heart Rate: 50 - 100 BPM nominal</text>
    <text x="12" y="165" fill="#f8fafc" font-size="11">&bull; Blood Oxygen (SpO2): 92 - 100 % nominal</text>
    <text x="12" y="181" fill="#94a3b8" font-size="10.5">Serial CLI overrides (SET_HR, SET_SPO2)</text>

    <!-- Synthetic ECG -->
    <rect x="0" y="210" width="320" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="12" y="234" fill="#38bdf8" font-size="13" font-weight="700">3. Continuous ECG Synthesis</text>
    <text x="12" y="254" fill="#f8fafc" font-size="11">&bull; 5 Hz cadence (200 ms real-time stream)</text>
    <text x="12" y="270" fill="#f8fafc" font-size="11">&bull; Mathematical Gaussian superposition model</text>
    <text x="12" y="286" fill="#94a3b8" font-size="10.5">Synthesizes P-Q-R-S-T cardiac cycle morphology</text>

    <!-- Environmental Sensors -->
    <rect x="0" y="315" width="320" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="12" y="339" fill="#38bdf8" font-size="13" font-weight="700">4. Facility Environment Monitoring</text>
    <text x="12" y="359" fill="#f8fafc" font-size="11">&bull; Room Temperature: 18.0 - 28.0 &#176;C</text>
    <text x="12" y="375" fill="#f8fafc" font-size="11">&bull; Atmospheric Oxygen: 19.5 - 24.0 %</text>
    <text x="12" y="391" fill="#f8fafc" font-size="11">&bull; Air Quality Index: 0 - 100 AQI nominal</text>

    <!-- PIR Motion -->
    <rect x="0" y="420" width="320" height="75" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="12" y="444" fill="#38bdf8" font-size="13" font-weight="700">5. Physical Motion Sensing</text>
    <text x="12" y="464" fill="#f8fafc" font-size="11">&bull; HC-SR501 PIR sensor on GPIO 27</text>
    <text x="12" y="480" fill="#94a3b8" font-size="10.5">Detects patient bed and clinical room occupancy</text>

    <!-- Enqueue Box -->
    <rect x="0" y="515" width="320" height="110" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="12" y="539" fill="#34d399" font-size="12" font-weight="700">CONCURRENT QUEUE INGESTION</text>
    <text x="12" y="560" fill="#94a3b8" font-size="11">Sensor readings packaged into SensorMessage structs and posted to FreeRTOS <tspan fill="#f8fafc">sensorQueue</tspan>.</text>
    <text x="12" y="595" fill="#38bdf8" font-size="11">Drained by displayTask under vitalsMutex.</text>
  </g>

  <!-- STAGE 2: THRESHOLD & RISK EVALUATION -->
  <rect x="420" y="115" width="360" height="905" rx="12" fill="url(#stepGrad2)" stroke="#059669" stroke-width="1.5" filter="url(#shadowFilter)"/>
  <rect x="420" y="115" width="360" height="42" rx="12" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="440" y="142" fill="#a7f3d0" font-size="16" font-weight="700">STAGE 2: EVALUATION &amp; RISK TIERS</text>

  <g transform="translate(440, 175)">
    <!-- Evaluation Engine Box -->
    <rect x="0" y="0" width="320" height="130" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
    <text x="12" y="25" fill="#34d399" font-size="13" font-weight="700">Tiered Threshold Evaluation Engine</text>
    <text x="12" y="48" fill="#f8fafc" font-size="11">&bull; Heart Rate: &lt;45 / &gt;120 (Crit), 45-50/100-120 (Warn)</text>
    <text x="12" y="66" fill="#f8fafc" font-size="11">&bull; SpO2: &lt;88% (Crit), 88-91% (Breathing Warn)</text>
    <text x="12" y="84" fill="#f8fafc" font-size="11">&bull; Body Temp: &lt;34 / &gt;39.5 (Crit), 34-36/38-39.5 (Warn)</text>
    <text x="12" y="102" fill="#f8fafc" font-size="11">&bull; Room: &lt;15 / &gt;35&#176;C &bull; O2: &lt;18 / &gt;25% &bull; AQI &gt;150</text>
    <text x="12" y="120" fill="#94a3b8" font-size="10">Aggregates overall state: NORMAL, WARNING, CRITICAL</text>

    <!-- Decision Diamond / Flow -->
    <rect x="20" y="160" width="280" height="70" rx="8" fill="#022c22" stroke="#34d399" stroke-width="1.5"/>
    <text x="35" y="188" fill="#f8fafc" font-size="13" font-weight="700">Is Telemetry State Abnormal?</text>
    <text x="35" y="210" fill="#a7f3d0" font-size="11">Rising Edge: abnormal &amp;&amp; !wasAbnormal</text>

    <!-- Branch 1: Normal Path -->
    <rect x="0" y="260" width="320" height="100" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="12" y="284" fill="#60a5fa" font-size="12" font-weight="700">PATH A: NOMINAL STATUS (GREEN)</text>
    <text x="12" y="304" fill="#f8fafc" font-size="11">&bull; Green LED (GPIO 33) remains active</text>
    <text x="12" y="322" fill="#f8fafc" font-size="11">&bull; Bed Servo remains at 10&#176; Sleeping resting angle</text>
    <text x="12" y="340" fill="#f8fafc" font-size="11">&bull; Sampling rate relaxes to 30s - 60s cadence</text>

    <!-- Branch 2: Warning Path -->
    <rect x="0" y="380" width="320" height="100" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="12" y="404" fill="#fbbf24" font-size="12" font-weight="700">PATH B: WARNING STATUS (YELLOW)</text>
    <text x="12" y="424" fill="#f8fafc" font-size="11">&bull; Yellow LED (GPIO 26) illuminated</text>
    <text x="12" y="442" fill="#f8fafc" font-size="11">&bull; SpO2 88-91%: Servo auto-elevates to 45&#176;</text>
    <text x="12" y="460" fill="#f8fafc" font-size="11">&bull; Sampling rate accelerates to 5s high-cadence</text>

    <!-- Branch 3: Critical Path -->
    <rect x="0" y="500" width="320" height="110" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.2"/>
    <text x="12" y="524" fill="#f87171" font-size="12" font-weight="700">PATH C: CRITICAL STATUS (RED ALARM)</text>
    <text x="12" y="544" fill="#f8fafc" font-size="11">&bull; Signals alertSemaphore &#8594; alertTask wakes up</text>
    <text x="12" y="562" fill="#f8fafc" font-size="11">&bull; SG90 Servo auto-elevates to 90&#176; Emergency</text>
    <text x="12" y="580" fill="#f8fafc" font-size="11">&bull; Red LED flashes &bull; High-priority event queued</text>
    <text x="12" y="598" fill="#f8fafc" font-size="11">&bull; Sampling rate locked at 5s interval</text>
  </g>

  <!-- STAGE 3: LOCAL ACTUATION & INTERLOCKS -->
  <rect x="810" y="115" width="360" height="905" rx="12" fill="url(#stepGrad3)" stroke="#7e22ce" stroke-width="1.5" filter="url(#shadowFilter)"/>
  <rect x="810" y="115" width="360" height="42" rx="12" fill="#581c87" stroke="#7e22ce" stroke-width="1"/>
  <text x="830" y="142" fill="#e9d5ff" font-size="16" font-weight="700">STAGE 3: ACTUATION &amp; INTERLOCKS</text>

  <g transform="translate(830, 175)">
    <!-- Task 3 Medication Workflow -->
    <rect x="0" y="0" width="320" height="175" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="12" y="24" fill="#c084fc" font-size="13" font-weight="700">Task 3: Medication Infusion Interlock</text>
    <text x="12" y="44" fill="#f8fafc" font-size="11">&bull; Inbound dosage slider: 0 - 100 mg/hr</text>
    <text x="12" y="60" fill="#f8fafc" font-size="11">&bull; Slew-Rate Limiter: clamped to +10 mg/hr/s</text>
    <text x="12" y="78" fill="#fbbf24" font-size="11">IF Requested Dose &gt; 80.0 mg/hr:</text>
    <text x="12" y="96" fill="#f87171" font-size="11">  1. Dose clamped at 80.0 mg/hr</text>
    <text x="12" y="112" fill="#f87171" font-size="11">  2. Rapid 3.3 Hz Red LED blink + Buzzer</text>
    <text x="12" y="128" fill="#f87171" font-size="11">  3. OLED: "PRESS BUTTON" prompt</text>
    <text x="12" y="146" fill="#34d399" font-size="11">  4. GPIO 13 Pushbutton pressed within 5s?</text>
    <text x="12" y="164" fill="#94a3b8" font-size="10.5">      YES &#8594; Apply dose | NO &#8594; Abort to 80.0</text>

    <!-- Task 4 Bed Workflow -->
    <rect x="0" y="195" width="320" height="135" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="12" y="219" fill="#c084fc" font-size="13" font-weight="700">Task 4: Bed Elevation Servo Control</text>
    <text x="12" y="239" fill="#f8fafc" font-size="11">&bull; Microsecond pulse conversion (500-2400 &#956;s)</text>
    <text x="12" y="255" fill="#f8fafc" font-size="11">&bull; Smooth interpolation slew: 1.5&#176;/s (auto), 2.0&#176;/s (manual)</text>
    <text x="12" y="273" fill="#38bdf8" font-size="11">&bull; Auto Mode Priority:</text>
    <text x="12" y="289" fill="#f87171" font-size="10.5">  1. Critical Vital &#8594; 90&#176; Emergency Elevation</text>
    <text x="12" y="305" fill="#fbbf24" font-size="10.5">  2. SpO2 88-91% &#8594; 45&#176; Breathing Support</text>
    <text x="12" y="321" fill="#34d399" font-size="10.5">  3. Stable Condition &#8594; 10&#176; Sleeping Rest Angle</text>

    <!-- Task 1 & 6 OLED Display Loop -->
    <rect x="0" y="350" width="320" height="145" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="12" y="374" fill="#c084fc" font-size="13" font-weight="700">OLED UI State Engine (100 ms)</text>
    <text x="12" y="394" fill="#f8fafc" font-size="11">&bull; Top Region (y=0..44): Live Medication Dose</text>
    <text x="12" y="410" fill="#f8fafc" font-size="11">&bull; Safety Label: NORMAL, WARNING, CRITICAL</text>
    <text x="12" y="426" fill="#f8fafc" font-size="11">&bull; Confirmation State: PROMPT / CONFIRMED</text>
    <text x="12" y="444" fill="#fbbf24" font-size="11">&bull; Bottom Row (y=54..63): Offline Banner</text>
    <text x="12" y="462" fill="#f8fafc" font-size="10.5">Inverted bar: [LOGGING OFFLINE]</text>
    <text x="12" y="478" fill="#94a3b8" font-size="10.5">Never clobbers active medication screen</text>
  </g>

  <!-- STAGE 4: FAULT TOLERANCE & CLOUD REPLAY -->
  <rect x="1200" y="115" width="370" height="905" rx="12" fill="url(#stepGrad4)" stroke="#c2410c" stroke-width="1.5" filter="url(#shadowFilter)"/>
  <rect x="1200" y="115" width="370" height="42" rx="12" fill="#7c2d12" stroke="#c2410c" stroke-width="1"/>
  <text x="1220" y="142" fill="#ffedd5" font-size="16" font-weight="700">STAGE 4: NETWORK &amp; FAULT REPLAY</text>

  <g transform="translate(1220, 175)">
    <!-- Connectivity Check -->
    <rect x="0" y="0" width="330" height="85" rx="8" fill="#1e293b" stroke="#ea580c" stroke-width="1.2"/>
    <text x="12" y="24" fill="#fb923c" font-size="13" font-weight="700">Connectivity Supervisor (Task 6)</text>
    <text x="12" y="44" fill="#f8fafc" font-size="11">&bull; Wi-Fi Connection (WiFi.status() == WL_CONNECTED)</text>
    <text x="12" y="60" fill="#f8fafc" font-size="11">&bull; MQTT Socket &amp; Ping (mqttClient.connected())</text>
    <text x="12" y="76" fill="#f8fafc" font-size="11">&bull; Task Heartbeat Auditor (6000 ms limit)</text>

    <!-- Branching -->
    <!-- Healthy Online -->
    <rect x="0" y="100" width="330" height="110" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
    <text x="12" y="124" fill="#34d399" font-size="12" font-weight="700">STATE 1: ONLINE (Nominal Cloud Streaming)</text>
    <text x="12" y="144" fill="#f8fafc" font-size="11">&bull; Telemetry round-robin publish (3000 ms cadence)</text>
    <text x="12" y="160" fill="#f8fafc" font-size="11">&bull; 6 Medical &amp; Facility feeds to Adafruit IO</text>
    <text x="12" y="176" fill="#f8fafc" font-size="11">&bull; 60s Periodic Summary insight packet</text>
    <text x="12" y="192" fill="#a7f3d0" font-size="10.5">Buzzer: Silent &bull; OLED: Normal screen</text>

    <!-- Degraded System -->
    <rect x="0" y="225" width="330" height="95" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="12" y="249" fill="#fbbf24" font-size="12" font-weight="700">STATE 2: SYSTEM_DEGRADED</text>
    <text x="12" y="269" fill="#f8fafc" font-size="11">&bull; Wi-Fi/MQTT up, but worker task missed heartbeat</text>
    <text x="12" y="285" fill="#f8fafc" font-size="11">&bull; Warning logged to Serial &amp; hospital-events</text>
    <text x="12" y="301" fill="#fca5a5" font-size="10.5">TWDT resets chip 2s later if hang is permanent</text>

    <!-- Disconnected Offline -->
    <rect x="0" y="335" width="330" height="150" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.2"/>
    <text x="12" y="359" fill="#f87171" font-size="12" font-weight="700">STATE 3: OFFLINE (Network Drop)</text>
    <text x="12" y="379" fill="#f8fafc" font-size="11">1. OLED: Displays [LOGGING OFFLINE] on row 54</text>
    <text x="12" y="397" fill="#f8fafc" font-size="11">2. Failure-Specific Buzzer Alarm:</text>
    <text x="12" y="413" fill="#fde68a" font-size="10.5">   &bull; Wi-Fi loss: Rapid double-pip cadence</text>
    <text x="12" y="429" fill="#fde68a" font-size="10.5">   &bull; MQTT loss: Slow single-beep cadence</text>
    <text x="12" y="447" fill="#f8fafc" font-size="11">3. Enqueue to FreeRTOS offlineBuffer:</text>
    <text x="12" y="463" fill="#93c5fd" font-size="10.5">   Holds up to 64 packets (~36.8 KB SRAM)</text>

    <!-- Reconnect Replay Engine -->
    <rect x="0" y="500" width="330" height="135" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="12" y="524" fill="#38bdf8" font-size="12" font-weight="700">AUTOMATIC CLOUD RE-SYNCHRONIZATION</text>
    <text x="12" y="544" fill="#f8fafc" font-size="11">&bull; Exponential Backoff Retry (2s &#8594; 4s &#8594; 8s .. 60s)</text>
    <text x="12" y="562" fill="#f8fafc" font-size="11">&bull; On Reconnect: Buzzer mutes &amp; OLED banner clears</text>
    <text x="12" y="580" fill="#f8fafc" font-size="11">&bull; Sequential FIFO Replay:</text>
    <text x="12" y="596" fill="#a7f3d0" font-size="10.5">   Drains 64 buffered packets in FIFO order</text>
    <text x="12" y="612" fill="#a7f3d0" font-size="10.5">   Paced to respect Adafruit IO 30 msg/min ceiling</text>
  </g>

  <!-- Connective Directional Arrows -->
  <path d="M 390 350 L 420 350" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#flowArrow)"/>
  <path d="M 780 430 L 810 430" stroke="#f59e0b" stroke-width="3" fill="none" marker-end="url(#flowArrow)"/>
  <path d="M 1170 350 L 1200 350" stroke="#c2410c" stroke-width="3" fill="none" marker-end="url(#flowArrow)"/>
</svg>