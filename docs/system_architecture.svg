<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050" style="background:#0f172a; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gradHardware" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gradCore0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="gradCore1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gradCloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="25" width="1540" height="70" rx="12" fill="url(#gradHeader)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="55" y="68" fill="#38bdf8" font-size="26" font-weight="700" letter-spacing="0.5">SMART HOSPITAL IoT SYSTEM — ESP32 &amp; FreeRTOS SMP ARCHITECTURE</text>
  <text x="1230" y="66" fill="#94a3b8" font-size="14" font-weight="500">Dual-Core Concurrency &bull; 6 Integrated Tasks &bull; Fault-Tolerant</text>

  <!-- ================= TIER 1: HARDWARE & SENSORS ================= -->
  <rect x="30" y="115" width="460" height="420" rx="12" fill="url(#gradHardware)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="30" y="115" width="460" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="50" y="142" fill="#38bdf8" font-size="16" font-weight="700">TIER 1: PHYSICAL HARDWARE &amp; TRANSDUCERS</text>

  <!-- Hardware Cards -->
  <g transform="translate(50, 175)">
    <!-- ESP32 Core Box -->
    <rect x="0" y="0" width="420" height="52" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
    <text x="15" y="25" fill="#f8fafc" font-size="14" font-weight="700">Espressif ESP32 DevKit-C v4</text>
    <text x="15" y="42" fill="#94a3b8" font-size="12">Dual-Core Xtensa LX6 @ 240 MHz &bull; 320 KB SRAM &bull; 4 MB Flash</text>

    <!-- DS18B20 -->
    <rect x="0" y="62" width="200" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="84" fill="#f8fafc" font-size="13" font-weight="600">DS18B20 Temp</text>
    <text x="12" y="101" fill="#38bdf8" font-size="11">GPIO 4 (1-Wire Bus, 4.7k Pullup)</text>

    <!-- PIR Motion -->
    <rect x="220" y="62" width="200" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="232" y="84" fill="#f8fafc" font-size="13" font-weight="600">HC-SR501 PIR</text>
    <text x="232" y="101" fill="#38bdf8" font-size="11">GPIO 27 (Digital Motion Input)</text>

    <!-- Button & Buzzer -->
    <rect x="0" y="122" width="200" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="144" fill="#f8fafc" font-size="13" font-weight="600">Confirmation Button</text>
    <text x="12" y="161" fill="#34d399" font-size="11">GPIO 13 (Debounced Pull-down)</text>

    <rect x="220" y="122" width="200" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="232" y="144" fill="#f8fafc" font-size="13" font-weight="600">Piezo Buzzer (1.2 kHz)</text>
    <text x="232" y="161" fill="#f87171" font-size="11">GPIO 14 (Multi-Cadence Tones)</text>

    <!-- LEDs -->
    <rect x="0" y="182" width="420" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="204" fill="#f8fafc" font-size="13" font-weight="600">Tri-Color Status LEDs (with 220&#937; Resistors)</text>
    <text x="15" y="221" fill="#94a3b8" font-size="11">
      <tspan fill="#f87171">&bull; Red: GPIO 25 (Crit)</tspan>
      <tspan fill="#fbbf24"> &bull; Yellow: GPIO 26 (Warn)</tspan>
      <tspan fill="#34d399"> &bull; Green: GPIO 33 (Normal)</tspan>
    </text>

    <!-- OLED Display & SG90 Servo -->
    <rect x="0" y="242" width="200" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="264" fill="#f8fafc" font-size="13" font-weight="600">SSD1306 128x64 OLED</text>
    <text x="12" y="281" fill="#a78bfa" font-size="11">I2C: GPIO 21 (SDA), 22 (SCL)</text>

    <rect x="220" y="242" width="200" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="232" y="264" fill="#f8fafc" font-size="13" font-weight="600">SG90 Bed Servo</text>
    <text x="232" y="281" fill="#fb923c" font-size="11">GPIO 18 (Smooth PWM Slew)</text>

    <text x="5" y="325" fill="#64748b" font-size="11" font-style="italic">Connected via Wokwi circuit simulation schematic (diagram.json)</text>
  </g>

  <!-- ================= TIER 2: FREERTOS CONCURRENCY ================= -->
  <rect x="510" y="115" width="600" height="905" rx="12" fill="url(#gradHardware)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="510" y="115" width="600" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="530" y="142" fill="#38bdf8" font-size="16" font-weight="700">TIER 2: FREERTOS DUAL-CORE SMP &amp; TASK SCHEDULING</text>

  <!-- Core 0 Network Partition -->
  <rect x="530" y="175" width="560" height="85" rx="10" fill="url(#gradCore0)" stroke="#059669" stroke-width="1.5"/>
  <text x="548" y="200" fill="#a7f3d0" font-size="14" font-weight="700">CORE 0: DEDICATED NETWORK STACK</text>
  <rect x="548" y="212" width="255" height="36" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="560" y="234" fill="#f8fafc" font-size="12" font-weight="600">Espressif 802.11 b/g/n Wi-Fi Driver</text>
  <rect x="815" y="212" width="255" height="36" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="835" y="234" fill="#f8fafc" font-size="12" font-weight="600">lwIP Embedded TCP/IP Stack</text>

  <!-- Core 1 Application Tasks Header -->
  <rect x="530" y="275" width="560" height="615" rx="10" fill="url(#gradCore1)" stroke="#2563eb" stroke-width="1.5"/>
  <text x="548" y="302" fill="#93c5fd" font-size="14" font-weight="700">CORE 1: APPLICATION WORKER THREAD POOL (12 Prioritized Tasks)</text>

  <!-- Task Items Grid -->
  <!-- Priority 5: Watchdog -->
  <rect x="548" y="315" width="524" height="45" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="562" y="335" fill="#fca5a5" font-size="12" font-weight="700">[PRIORITY 5] watchdogTask (1000 ms cadence)</text>
  <text x="562" y="350" fill="#94a3b8" font-size="11">Audits task heartbeats &bull; Feeds ESP-IDF Task Watchdog (8000 ms hardware panic threshold)</text>

  <!-- Priority 4: Alert Task -->
  <rect x="548" y="368" width="524" height="45" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="562" y="388" fill="#fde68a" font-size="12" font-weight="700">[PRIORITY 4] alertTask (Event-Driven Binary Semaphore)</text>
  <text x="562" y="403" fill="#94a3b8" font-size="11">Awaits alertSemaphore &bull; Captures thread-safe telemetry snapshot &bull; Audits clinical alarms</text>

  <!-- Priority 3: Medical High-Cadence -->
  <rect x="548" y="421" width="256" height="48" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="558" y="441" fill="#bfdbfe" font-size="12" font-weight="700">[PRI 3] vitalSensorTask</text>
  <text x="558" y="457" fill="#94a3b8" font-size="10.5">PPG HR (50-100) &amp; SpO2 (92-100%)</text>

  <rect x="816" y="421" width="256" height="48" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="826" y="441" fill="#bfdbfe" font-size="12" font-weight="700">[PRI 3] ecgTask</text>
  <text x="826" y="457" fill="#94a3b8" font-size="10.5">5 Hz Gaussian Cycle Waveform (200 ms)</text>

  <rect x="548" y="477" width="524" height="48" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="558" y="497" fill="#bfdbfe" font-size="12" font-weight="700">[PRI 3] medicationTask (50 Hz / 20 ms cadence)</text>
  <text x="558" y="513" fill="#94a3b8" font-size="10.5">Slew rate limiter (+10 mg/hr/s) &bull; Button confirmation debounce &bull; 3.3 Hz rapid alarm</text>

  <!-- Priority 2: Control & Sensors -->
  <rect x="548" y="533" width="256" height="48" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="558" y="553" fill="#e2e8f0" font-size="12" font-weight="700">[PRI 2] bedTask (50 Hz)</text>
  <text x="558" y="569" fill="#94a3b8" font-size="10.5">Smooth PWM servo (10&#176;, 45&#176;, 90&#176;)</text>

  <rect x="816" y="533" width="256" height="48" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="826" y="553" fill="#e2e8f0" font-size="12" font-weight="700">[PRI 2] samplingTask (1000 ms)</text>
  <text x="826" y="569" fill="#94a3b8" font-size="10.5">Adaptive cadence (5s vs 30s)</text>

  <rect x="548" y="589" width="256" height="48" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="558" y="609" fill="#e2e8f0" font-size="12" font-weight="700">[PRI 2] envSensorTask (1000 ms)</text>
  <text x="558" y="625" fill="#94a3b8" font-size="10.5">Room Temp, Oxygen %, AQI</text>

  <rect x="816" y="589" width="256" height="48" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="826" y="609" fill="#e2e8f0" font-size="12" font-weight="700">[PRI 2] temperatureTask</text>
  <text x="826" y="625" fill="#94a3b8" font-size="10.5">Non-blocking 750 ms DS18B20 state</text>

  <rect x="548" y="645" width="256" height="48" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="558" y="665" fill="#e2e8f0" font-size="12" font-weight="700">[PRI 2] motionTask (1000 ms)</text>
  <text x="558" y="681" fill="#94a3b8" font-size="10.5">PIR Digital edge detector</text>

  <rect x="816" y="645" width="256" height="48" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="826" y="665" fill="#e2e8f0" font-size="12" font-weight="700">[PRI 2] mqttTask (3000 ms round-robin)</text>
  <text x="826" y="681" fill="#94a3b8" font-size="10.5">Adafruit IO client &bull; FIFO Replay</text>

  <!-- Priority 1: Display -->
  <rect x="548" y="701" width="524" height="48" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="558" y="721" fill="#cbd5e1" font-size="12" font-weight="700">[PRIORITY 1] displayTask (100 ms cadence)</text>
  <text x="558" y="737" fill="#94a3b8" font-size="10.5">SSD1306 OLED rendering &bull; Real-time medication dose &bull; Bottom row LOGGING OFFLINE banner</text>

  <!-- FreeRTOS Inter-Task Communication & Sync Primitives -->
  <rect x="548" y="760" width="524" height="115" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="562" y="780" fill="#38bdf8" font-size="12" font-weight="700">THREAD-SAFE SYNCHRONIZATION &amp; QUEUES (Zero Race Conditions)</text>
  <text x="562" y="802" fill="#94a3b8" font-size="11">&bull; <tspan fill="#f8fafc">vitalsMutex</tspan>: Protects atomic reads/writes to clinical &amp; environmental state</text>
  <text x="562" y="820" fill="#94a3b8" font-size="11">&bull; <tspan fill="#f8fafc">sensorQueue, alertQueue, dosageQueue, bedAngleQueue, samplingRateQueue</tspan></text>
  <text x="562" y="838" fill="#94a3b8" font-size="11">&bull; <tspan fill="#f8fafc">offlineBuffer</tspan>: 64-item RAM FIFO queue (~36.8 KB SRAM) for fault-tolerant telemetry storage</text>
  <text x="562" y="856" fill="#94a3b8" font-size="11">&bull; <tspan fill="#34d399">100% Non-Blocking</tspan>: Zero raw delay() &bull; Pure vTaskDelay() &amp; vTaskDelayUntil()</text>

  <!-- ================= TIER 3: EDGE CONTROL LOGIC ================= -->
  <rect x="30" y="550" width="460" height="470" rx="12" fill="url(#gradHardware)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="30" y="550" width="460" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="50" y="577" fill="#38bdf8" font-size="16" font-weight="700">TIER 3: EDGE SAFETY &amp; CONTROL STATE MACHINES</text>

  <g transform="translate(50, 610)">
    <!-- Task 3 Medication Box -->
    <rect x="0" y="0" width="420" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="14" y="22" fill="#f8fafc" font-size="13" font-weight="700">Task 3: Medication Slew Rate &amp; Safety Interlock</text>
    <text x="14" y="40" fill="#94a3b8" font-size="11">&bull; Range: 0.0 - 100.0 mg/hr &bull; Slew-Rate Clamped: Max +10.0 mg/hr per step</text>
    <text x="14" y="56" fill="#f87171" font-size="11">&bull; Dose &gt; 80 mg/hr: 3.3 Hz Red LED + Buzzer alarm &bull; Requires GPIO 13 confirmation</text>

    <!-- Task 4 Bed Box -->
    <rect x="0" y="85" width="420" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="14" y="107" fill="#f8fafc" font-size="13" font-weight="700">Task 4: Intelligent Autonomous Bed Elevation</text>
    <text x="14" y="125" fill="#94a3b8" font-size="11">&bull; Emergency Mode (90&#176;): Immediate elevation on any Critical vital sign</text>
    <text x="14" y="141" fill="#38bdf8" font-size="11">&bull; Breathing Support (45&#176;): Auto triggered for SpO2 88-91% &bull; Rest (10&#176;): Nominal</text>

    <!-- Task 5 Sampling Box -->
    <rect x="0" y="170" width="420" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="14" y="192" fill="#f8fafc" font-size="13" font-weight="700">Task 5: Smart Dynamic Adaptive Sampling</text>
    <text x="14" y="210" fill="#94a3b8" font-size="11">&bull; Normal Mode: 30s - 60s sampling interval (Battery &amp; bandwidth optimization)</text>
    <text x="14" y="226" fill="#fbbf24" font-size="11">&bull; Abnormal Mode: 5s high-frequency cadence upon Warning or Critical states</text>

    <!-- Task 6 Offline State Machine -->
    <rect x="0" y="255" width="420" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="14" y="277" fill="#f8fafc" font-size="13" font-weight="700">Task 6: Advanced Offline Tri-State Health Supervisor</text>
    <text x="14" y="295" fill="#34d399" font-size="11">&bull; States: ONLINE &bull; DEGRADED (Task stall) &bull; OFFLINE (Wi-Fi/MQTT loss)</text>
    <text x="14" y="311" fill="#fbbf24" font-size="11">&bull; Failure Beeps: Double pip (Wi-Fi drop) vs. Slow single beep (MQTT broker loss)</text>
    <text x="14" y="327" fill="#38bdf8" font-size="11">&bull; Cloud Sync: Exponential Backoff (2s &#8594; 60s) &bull; Bounded FIFO draining</text>
  </g>

  <!-- ================= TIER 4: CLOUD & MQTT ================= -->
  <rect x="1130" y="115" width="440" height="905" rx="12" fill="url(#gradCloud)" stroke="#7e22ce" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="1130" y="115" width="440" height="42" rx="12" fill="#581c87" stroke="#7e22ce" stroke-width="1"/>
  <text x="1150" y="142" fill="#e9d5ff" font-size="16" font-weight="700">TIER 4: CLOUD IoT &amp; ROLE-BASED DASHBOARDS</text>

  <g transform="translate(1150, 175)">
    <!-- Broker Info -->
    <rect x="0" y="0" width="400" height="52" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="1"/>
    <text x="15" y="24" fill="#f8fafc" font-size="13" font-weight="700">Adafruit IO Cloud MQTT Broker</text>
    <text x="15" y="41" fill="#d8b4fe" font-size="11">Host: io.adafruit.com &bull; Port: 1883 &bull; Max 30 data points/min</text>

    <!-- Role 1: Medical Staff -->
    <rect x="0" y="65" width="400" height="150" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
    <text x="15" y="90" fill="#a5b4fc" font-size="13" font-weight="700">ROLE 1: MEDICAL STAFF DASHBOARD</text>
    <text x="15" y="112" fill="#f8fafc" font-size="11">&bull; Topic: <tspan fill="#38bdf8">hospital-heart-rate</tspan> (50-100 BPM nominal)</text>
    <text x="15" y="130" fill="#f8fafc" font-size="11">&bull; Topic: <tspan fill="#38bdf8">hospital-spo2</tspan> (92-100 % nominal)</text>
    <text x="15" y="148" fill="#f8fafc" font-size="11">&bull; Topic: <tspan fill="#38bdf8">hospital-body-temp</tspan> (36.0-38.0 &#176;C nominal)</text>
    <text x="15" y="168" fill="#94a3b8" font-size="10.5">Predefined Safe Thresholds &bull; Clinical Gauge Visualizations</text>
    <text x="15" y="185" fill="#f87171" font-size="10.5">Critical Emergency Alerts &bull; Bed Elevation Interlock</text>

    <!-- Role 2: Facility Management -->
    <rect x="0" y="230" width="400" height="150" rx="8" fill="#042f2e" stroke="#14b8a6" stroke-width="1.2"/>
    <text x="15" y="255" fill="#5eead4" font-size="13" font-weight="700">ROLE 2: FACILITY MANAGEMENT DASHBOARD</text>
    <text x="15" y="277" fill="#f8fafc" font-size="11">&bull; Topic: <tspan fill="#2dd4bf">hospital-room-temp</tspan> (18.0-28.0 &#176;C nominal)</text>
    <text x="15" y="295" fill="#f8fafc" font-size="11">&bull; Topic: <tspan fill="#2dd4bf">hospital-room-oxygen</tspan> (19.5-24.0 % nominal)</text>
    <text x="15" y="313" fill="#f8fafc" font-size="11">&bull; Topic: <tspan fill="#2dd4bf">hospital-air-quality</tspan> (0-100 AQI nominal)</text>
    <text x="15" y="333" fill="#94a3b8" font-size="10.5">Environmental Compliance Gauges &bull; Facility Safety Alarms</text>
    <text x="15" y="350" fill="#fbbf24" font-size="10.5">Ventilation &amp; Atmospheric Hazard Monitoring</text>

    <!-- Events & Controls -->
    <rect x="0" y="395" width="400" height="150" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="1.2"/>
    <text x="15" y="420" fill="#e9d5ff" font-size="13" font-weight="700">BIDIRECTIONAL CONTROLS &amp; EVENTS</text>
    <text x="15" y="442" fill="#f8fafc" font-size="11">&bull; Inbound: <tspan fill="#c084fc">hospital-dosage</tspan> (0 - 100 mg/hr Slider)</text>
    <text x="15" y="460" fill="#f8fafc" font-size="11">&bull; Inbound: <tspan fill="#c084fc">hospital-bed-angle</tspan> (0 - 90&#176; Slider)</text>
    <text x="15" y="478" fill="#f8fafc" font-size="11">&bull; Inbound: <tspan fill="#c084fc">hospital-sampling-rate</tspan> (5 - 60 s Slider)</text>
    <text x="15" y="498" fill="#f8fafc" font-size="11">&bull; Outbound: <tspan fill="#f43f5e">hospital-events</tspan> (Multiplexed Alerts &amp; Logs)</text>
    <text x="15" y="516" fill="#94a3b8" font-size="10.5">60s Periodic Aggregated Telemetry Insights Stream</text>

    <!-- Summary Box -->
    <rect x="0" y="560" width="400" height="110" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="15" y="582" fill="#38bdf8" font-size="12" font-weight="700">ENTERPRISE QUOTA &amp; TRAFFIC MANAGEMENT</text>
    <text x="15" y="602" fill="#94a3b8" font-size="10.5">&bull; Strict 10-Feed Limit Optimization on Adafruit IO Free Tier</text>
    <text x="15" y="620" fill="#94a3b8" font-size="10.5">&bull; Paced 3000 ms Round-Robin Telemetry Dispatch</text>
    <text x="15" y="638" fill="#94a3b8" font-size="10.5">&bull; Reconnection Rate Limiting to prevent cloud throttle</text>
  </g>

  <!-- Connective Arrows & Data Lines -->
  <!-- Line 1: Hardware to Core 1 -->
  <path d="M 490 280 L 510 280" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <!-- Line 2: Core 1 to Edge State Machines -->
  <path d="M 530 650 L 490 650" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
  <!-- Line 3: Core 0 / Core 1 to Cloud -->
  <path d="M 1110 215 L 1130 215" stroke="#10b981" stroke-width="2.5" fill="none"/>
  <path d="M 1110 660 L 1130 660" stroke="#a855f7" stroke-width="2.5" fill="none"/>
</svg>