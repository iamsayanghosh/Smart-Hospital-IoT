<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="1400" height="950" style="background:#0b1120; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="wfArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="wfArrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="wfArrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="wfArrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="1340" height="65" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="55" y="52" fill="#f8fafc" font-size="22" font-weight="bold">Smart Hospital IoT System &amp;mdash; End-to-End Workflow &amp;amp; Block Diagram</text>
  <text x="55" y="72" fill="#94a3b8" font-size="13">Telemetry Ingestion &bull; Concurrent Processing &bull; Autonomous Clinical Actuation &bull; Tri-State Fault-Tolerant Replay Pipeline</text>

  <!-- STAGE 1: Data Acquisition (Left Column) -->
  <rect x="30" y="105" width="280" height="815" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="45" y="120" width="250" height="32" rx="6" fill="#047857"/>
  <text x="55" y="142" fill="#ecfdf5" font-size="13" font-weight="bold">STAGE 1: DATA ACQUISITION</text>

  <!-- Stage 1 Items -->
  <g transform="translate(45, 165)">
    <!-- Temp -->
    <rect x="0" y="0" width="250" height="110" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="12" y="22" fill="#a7f3d0" font-size="12" font-weight="bold">DS18B20 1-Wire State Machine</text>
    <text x="12" y="40" fill="#94a3b8" font-size="10">Non-blocking Two-Phase Cycle:</text>
    <text x="12" y="58" fill="#e2e8f0" font-size="10">&bull; Phase 1: Request Temp Conversion</text>
    <text x="12" y="74" fill="#e2e8f0" font-size="10">&bull; Phase 2: 750 ms non-blocking wait</text>
    <text x="12" y="90" fill="#e2e8f0" font-size="10">&bull; Phase 3: Read Scratchpad via GPIO 4</text>
    <text x="12" y="104" fill="#64748b" font-size="9">Never stalls RTOS scheduler</text>

    <!-- PIR -->
    <rect x="0" y="125" width="250" height="70" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="12" y="147" fill="#a7f3d0" font-size="12" font-weight="bold">HC-SR501 Motion Detection</text>
    <text x="12" y="165" fill="#e2e8f0" font-size="10">&bull; Digital GPIO 27 Sampling</text>
    <text x="12" y="181" fill="#e2e8f0" font-size="10">&bull; Periodic 1000 ms Heartbeat Check</text>

    <!-- Synthetic PPG -->
    <rect x="0" y="210" width="250" height="95" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="12" y="232" fill="#a7f3d0" font-size="12" font-weight="bold">Optical PPG Pulse Oximetry</text>
    <text x="12" y="250" fill="#e2e8f0" font-size="10">&bull; Heart Rate: 50 - 100 BPM nominal</text>
    <text x="12" y="266" fill="#e2e8f0" font-size="10">&bull; SpO2: 92% - 100% nominal</text>
    <text x="12" y="282" fill="#e2e8f0" font-size="10">&bull; Dynamic Rate: 5s abnormal, 30s stable</text>
    <text x="12" y="296" fill="#64748b" font-size="9">CLI override: SET_HR, SET_SPO2</text>

    <!-- Synthetic ECG -->
    <rect x="0" y="320" width="250" height="95" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="12" y="342" fill="#a7f3d0" font-size="12" font-weight="bold">Synthetic ECG Waveform Generator</text>
    <text x="12" y="360" fill="#e2e8f0" font-size="10">&bull; 5 Hz Real-Time Superposition</text>
    <text x="12" y="376" fill="#e2e8f0" font-size="10">&bull; Gaussian P-Q-R-S-T morphology</text>
    <text x="12" y="392" fill="#e2e8f0" font-size="10">&bull; 200 ms Non-blocking Cadence</text>
    <text x="12" y="406" fill="#64748b" font-size="9">Demonstration IoT model</text>

    <!-- Environmental -->
    <rect x="0" y="430" width="250" height="95" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="12" y="452" fill="#a7f3d0" font-size="12" font-weight="bold">Facility Ambient Sensors</text>
    <text x="12" y="470" fill="#e2e8f0" font-size="10">&bull; Room Temperature (18 - 28 °C)</text>
    <text x="12" y="486" fill="#e2e8f0" font-size="10">&bull; Oxygen Level (19.5% - 24.0%)</text>
    <text x="12" y="502" fill="#e2e8f0" font-size="10">&bull; Air Quality Index (0 - 100 AQI)</text>
    <text x="12" y="516" fill="#64748b" font-size="9">CLI override: SET_ROOM, SET_OXYGEN, SET_AQI</text>

    <!-- Push into SensorQueue -->
    <rect x="0" y="540" width="250" height="60" rx="8" fill="#065f46" stroke="#059669" stroke-width="1.5"/>
    <text x="12" y="563" fill="#ecfdf5" font-size="12" font-weight="bold">sensorQueue [Capacity: 10]</text>
    <text x="12" y="581" fill="#a7f3d0" font-size="10">All sensor tasks pack SensorMessage</text>
    <text x="12" y="593" fill="#a7f3d0" font-size="9">and push asynchronously into FIFO queue</text>
  </g>

  <!-- STAGE 2: Processing & State Management (Middle-Left Column) -->
  <rect x="330" y="105" width="310" height="815" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="345" y="120" width="280" height="32" rx="6" fill="#1d4ed8"/>
  <text x="355" y="142" fill="#eff6ff" font-size="13" font-weight="bold">STAGE 2: PROCESSING &amp; EVALUATION</text>

  <!-- Stage 2 Items -->
  <g transform="translate(345, 165)">
    <!-- Central Telemetry Drain -->
    <rect x="0" y="0" width="280" height="95" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="12" y="22" fill="#93c5fd" font-size="12" font-weight="bold">Central Telemetry Aggregator</text>
    <text x="12" y="40" fill="#e2e8f0" font-size="10">&bull; Drains sensorQueue inside displayTask</text>
    <text x="12" y="56" fill="#e2e8f0" font-size="10">&bull; Spinlock protected: telemetryMux</text>
    <text x="12" y="72" fill="#e2e8f0" font-size="10">&bull; Updates atomic SystemState record</text>
    <text x="12" y="88" fill="#64748b" font-size="9">Guarantees zero race conditions</text>

    <!-- 3-Tier Threshold Engine -->
    <rect x="0" y="110" width="280" height="150" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="12" y="132" fill="#93c5fd" font-size="12" font-weight="bold">3-Tier Clinical &amp; Facility Thresholds</text>
    <text x="12" y="150" fill="#22c55e" font-size="10">&bull; NORMAL: HR 50-100, SpO2 &gt;=92%, Temp 36-38</text>
    <text x="12" y="166" fill="#eab308" font-size="10">&bull; WARNING: HR 45-50 / 100-120, SpO2 88-91%</text>
    <text x="12" y="182" fill="#ef4444" font-size="10">&bull; CRITICAL: HR &lt;45 or &gt;120, SpO2 &lt;88%, Temp &gt;39.5</text>
    <text x="12" y="200" fill="#6ee7b7" font-size="10">&bull; FACILITY NORMAL: Room 18-28°C, O2 19.5-24%, AQI &lt;100</text>
    <text x="12" y="216" fill="#fde68a" font-size="10">&bull; FACILITY WARNING: Room 15-18 / 28-35°C, AQI 101-150</text>
    <text x="12" y="232" fill="#fca5a5" font-size="10">&bull; FACILITY CRITICAL: Room &gt;35°C, O2 &lt;18%, AQI &gt;150</text>
    <text x="12" y="250" fill="#64748b" font-size="9">Rising edge transition gives alertSemaphore</text>

    <!-- Watchdog & Health Monitor -->
    <rect x="0" y="275" width="280" height="110" rx="8" fill="#1e293b" stroke="#e11d48" stroke-width="1"/>
    <text x="12" y="297" fill="#fda4af" font-size="12" font-weight="bold">Dual-Tier Watchdog Supervisor</text>
    <text x="12" y="315" fill="#e2e8f0" font-size="10">&bull; Hardware: ESP-IDF TWDT (8000 ms panic)</text>
    <text x="12" y="331" fill="#e2e8f0" font-size="10">&bull; Software: watchdogTask audits heartbeats</text>
    <text x="12" y="347" fill="#e2e8f0" font-size="10">&bull; Cadence: 6000 ms regular audit loop</text>
    <text x="12" y="363" fill="#fca5a5" font-size="10">&bull; Stalled task triggers SYSTEM_DEGRADED</text>
    <text x="12" y="377" fill="#64748b" font-size="9">Fail-safe reboot ~2s later if unresponsive</text>

    <!-- Dynamic Rate Adjustment Logic -->
    <rect x="0" y="400" width="280" height="110" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="12" y="422" fill="#93c5fd" font-size="12" font-weight="bold">Task 5: Adaptive Sampling Manager</text>
    <text x="12" y="440" fill="#e2e8f0" font-size="10">&bull; Monitors vitalState (Normal vs Abnormal)</text>
    <text x="12" y="456" fill="#e2e8f0" font-size="10">&bull; Abnormal: Auto-switch to 5s high-frequency</text>
    <text x="12" y="472" fill="#e2e8f0" font-size="10">&bull; Stable: Auto-relax to 30s battery saving</text>
    <text x="12" y="488" fill="#e2e8f0" font-size="10">&bull; Doctor manual slider: 5s to 60s</text>
    <text x="12" y="502" fill="#64748b" font-size="9">Dispatches rate via samplingRateQueue</text>
  </g>

  <!-- STAGE 3: Local Safety & Actuation (Middle-Right Column) -->
  <rect x="660" y="105" width="350" height="815" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="675" y="120" width="320" height="32" rx="6" fill="#b91c1c"/>
  <text x="685" y="142" fill="#fef2f2" font-size="13" font-weight="bold">STAGE 3: LOCAL ACTUATION &amp; SAFETY</text>

  <!-- Stage 3 Items -->
  <g transform="translate(675, 165)">
    <!-- Task 3 Medication Interlock -->
    <rect x="0" y="0" width="320" height="185" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="12" y="24" fill="#fca5a5" font-size="13" font-weight="bold">Task 3: Smart Medication Infusion Safety</text>
    <text x="12" y="44" fill="#e2e8f0" font-size="11">&bull; Requested Dosage: 0 - 100 mg/hr</text>
    <text x="12" y="60" fill="#22c55e" font-size="11">&bull; 0.0 - 79.9 mg/hr: Normal (Solid Green LED)</text>
    <text x="12" y="76" fill="#eab308" font-size="11">&bull; 80.0 mg/hr: Warning (Solid Yellow LED)</text>
    <text x="12" y="94" fill="#ef4444" font-size="11" font-weight="bold">&bull; &gt; 80.0 mg/hr: CRITICAL INTERLOCK</text>
    <text x="24" y="110" fill="#fca5a5" font-size="10">1. Clamps applied dose at 80.0 mg/hr</text>
    <text x="24" y="124" fill="#fca5a5" font-size="10">2. Rapid 3.3 Hz Red LED Blink + Buzzer Tone</text>
    <text x="24" y="138" fill="#fca5a5" font-size="10">3. OLED prompts &quot;PRESS BUTTON&quot; (GPIO 13)</text>
    <text x="24" y="152" fill="#fca5a5" font-size="10">4. 5-Second Timeout: If unconfirmed, aborts</text>
    <text x="12" y="172" fill="#60a5fa" font-size="10">&bull; Slew Rate Limiter: Max step +10 mg/hr/sec</text>

    <!-- Task 4 Bed Control -->
    <rect x="0" y="200" width="320" height="155" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="12" y="224" fill="#a5f3fc" font-size="13" font-weight="bold">Task 4: Intelligent Bed Elevation Control</text>
    <text x="12" y="244" fill="#e2e8f0" font-size="11">&bull; Actuator: SG90 Servo on GPIO 18 (PWM)</text>
    <text x="12" y="260" fill="#22d3ee" font-size="11" font-weight="bold">&bull; Autonomous Patient-Condition Mapping:</text>
    <text x="24" y="278" fill="#cbd5e1" font-size="10">- Sleeping Mode: 10° resting (stable vitals)</text>
    <text x="24" y="294" fill="#cbd5e1" font-size="10">- Breathing Support: 45° (SpO2 88-91% warning)</text>
    <text x="24" y="310" fill="#cbd5e1" font-size="10">- Emergency Mode: 90° upright (critical vitals)</text>
    <text x="12" y="330" fill="#e2e8f0" font-size="11">&bull; Doctor Manual Slider: 0° to 90° remote control</text>
    <text x="12" y="346" fill="#94a3b8" font-size="10">&bull; Slew Smoothing: Gradual interpolation (1.5°-2°/s)</text>

    <!-- SSD1306 OLED UI Rendering -->
    <rect x="0" y="370" width="320" height="135" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="12" y="394" fill="#ddd6fe" font-size="13" font-weight="bold">SSD1306 OLED Screen Layout (128x64)</text>
    <text x="12" y="414" fill="#c4b5fd" font-size="11">&bull; Rows y: 0 .. 44 (Medication Live State):</text>
    <text x="24" y="430" fill="#e2e8f0" font-size="10">Dose: xx.x mg/hr | Status: NORMAL/WARN/CRIT</text>
    <text x="24" y="444" fill="#e2e8f0" font-size="10">If Pending: Req / Now / PRESS BUTTON</text>
    <text x="12" y="464" fill="#f59e0b" font-size="11">&bull; Rows y: 54 .. 63 (Task 6 Inverted Banner):</text>
    <text x="24" y="480" fill="#fde68a" font-size="10">Draws white bar: &quot;LOGGING OFFLINE&quot;</text>
    <text x="12" y="496" fill="#64748b" font-size="9">Dual-zone layout: Offline alert never clobbers dose UI</text>
  </g>

  <!-- STAGE 4: Cloud & Fault-Tolerant Replay (Right Column) -->
  <rect x="1030" y="105" width="340" height="815" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="1045" y="120" width="310" height="32" rx="6" fill="#7c3aed"/>
  <text x="1055" y="142" fill="#f5f3ff" font-size="13" font-weight="bold">STAGE 4: CLOUD &amp; FAULT-TOLERANT REPLAY</text>

  <!-- Stage 4 Items -->
  <g transform="translate(1045, 165)">
    <!-- Tri-State Health Evaluator -->
    <rect x="0" y="0" width="310" height="110" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="12" y="24" fill="#e9d5ff" font-size="13" font-weight="bold">Tri-State Health Decision Matrix</text>
    <text x="12" y="44" fill="#22c55e" font-size="11">&bull; ONLINE: Wi-Fi connected &amp; MQTT active</text>
    <text x="12" y="60" fill="#eab308" font-size="11">&bull; DEGRADED: Transport OK, Task Heartbeat stall</text>
    <text x="12" y="76" fill="#ef4444" font-size="11">&bull; OFFLINE: Wi-Fi lost or MQTT disconnected</text>
    <text x="12" y="96" fill="#fca5a5" font-size="10">Triggers distinct failure tones &amp; local buffer</text>

    <!-- Failure-Specific Buzzer Cadences -->
    <rect x="0" y="125" width="310" height="110" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="12" y="149" fill="#fde68a" font-size="12" font-weight="bold">Task 6: Acoustic Failure Patterns</text>
    <text x="12" y="169" fill="#e2e8f0" font-size="11">&bull; Wi-Fi Disconnect: Double-Pip Cadence</text>
    <text x="24" y="185" fill="#94a3b8" font-size="10">0-100 ms ON, 200-300 ms ON per 1000 ms</text>
    <text x="12" y="203" fill="#e2e8f0" font-size="11">&bull; MQTT Broker Drop: Slow Single Beep</text>
    <text x="24" y="219" fill="#94a3b8" font-size="10">0-500 ms ON, 500-1000 ms OFF per 1000 ms</text>
    <text x="12" y="233" fill="#64748b" font-size="9">Medication alarm overrides network beeps</text>

    <!-- Local RAM FIFO Buffer -->
    <rect x="0" y="250" width="310" height="120" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="12" y="274" fill="#fde68a" font-size="13" font-weight="bold">Local RAM FIFO Buffer (offlineBuffer)</text>
    <text x="12" y="294" fill="#e2e8f0" font-size="11">&bull; Capacity: 64 Telemetry Records (~36.8 KB)</text>
    <text x="12" y="310" fill="#e2e8f0" font-size="11">&bull; Policy: Drops newest entries when saturated</text>
    <text x="12" y="326" fill="#e2e8f0" font-size="11">&bull; Preservation: Protects initial failure state</text>
    <text x="12" y="344" fill="#cbd5e1" font-size="10">&bull; Volatile: SRAM-based for real-time safety</text>
    <text x="12" y="358" fill="#64748b" font-size="9">CLI test: SIM_OFFLINE WIFI / MQTT</text>

    <!-- Exponential Backoff & Replay -->
    <rect x="0" y="385" width="310" height="130" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="12" y="409" fill="#a7f3d0" font-size="13" font-weight="bold">Exponential Backoff &amp; Replay Engine</text>
    <text x="12" y="429" fill="#e2e8f0" font-size="11">&bull; Reconnection Retry: 2s -&gt; 4s -&gt; 8s ... -&gt; 60s max</text>
    <text x="12" y="445" fill="#e2e8f0" font-size="11">&bull; On Connect: Drains offlineBuffer in FIFO order</text>
    <text x="12" y="461" fill="#e2e8f0" font-size="11">&bull; Rate-Limited: Paced to obey Adafruit IO quotas</text>
    <text x="12" y="479" fill="#6ee7b7" font-size="10">&bull; Reconnection Replay preserves data integrity</text>
    <text x="12" y="495" fill="#64748b" font-size="9">CLI test: SIM_ONLINE flushes buffer to cloud</text>

    <!-- Adafruit IO Dashboards -->
    <rect x="0" y="530" width="310" height="185" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1"/>
    <text x="12" y="554" fill="#c7d2fe" font-size="13" font-weight="bold">Adafruit IO Dual-Role Dashboards</text>
    <text x="12" y="574" fill="#93c5fd" font-size="11" font-weight="bold">Medical Staff Dashboard (Vitals):</text>
    <text x="24" y="590" fill="#bfdbfe" font-size="10">Heart Rate, SpO2, Body Temp Gauges</text>
    <text x="12" y="610" fill="#6ee7b7" font-size="11" font-weight="bold">Facility Dashboard (Environment):</text>
    <text x="24" y="626" fill="#a7f3d0" font-size="10">Room Temp, Oxygen %, AQI Gauges</text>
    <text x="12" y="646" fill="#fde68a" font-size="11" font-weight="bold">Interactive Sliders &amp; Event Stream:</text>
    <text x="24" y="662" fill="#fef08a" font-size="10">Dosage (0-100), Bed (0-90), Sampling (5-60)</text>
    <text x="24" y="678" fill="#fca5a5" font-size="10">hospital-events (Alerts &amp; 60s Summaries)</text>
    <text x="12" y="698" fill="#64748b" font-size="9">Full 10-feed quota utilization</text>
  </g>

  <!-- Connective Arrows between Stages -->
  <path d="M 295 730 L 345 210" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#wfArrowGreen)"/>
  <path d="M 625 240 L 675 250" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#wfArrowRed)"/>
  <path d="M 625 330 L 675 435" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#wfArrow)"/>
  <path d="M 995 250 L 1045 220" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#wfArrowAmber)"/>
  <path d="M 995 440 L 1045 620" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#wfArrow)"/>
</svg>