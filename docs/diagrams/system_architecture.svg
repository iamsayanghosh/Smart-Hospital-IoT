<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" width="1400" height="920" style="background:#0f172a; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardCore0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardCore1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="cardHW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="cardCloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="1340" height="65" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="55" y="52" fill="#f8fafc" font-size="22" font-weight="bold">Smart Hospital IoT System &#8212; System Architecture Diagram</text>
  <text x="55" y="72" fill="#94a3b8" font-size="13">Dual-Core ESP32 SoC Architecture &bull; FreeRTOS SMP Multitasking &bull; Thread-Safe IPC &bull; Hardware Peripherals &bull; Adafruit IO MQTT</text>

  <!-- Hardware Layer (Left Column) -->
  <rect x="30" y="105" width="310" height="785" rx="12" fill="url(#cardHW)" stroke="#059669" stroke-width="1.5"/>
  <rect x="45" y="120" width="280" height="35" rx="8" fill="#065f46"/>
  <text x="60" y="143" fill="#6ee7b7" font-size="14" font-weight="bold">HARDWARE PERIPHERALS</text>

  <!-- Hardware Items -->
  <g transform="translate(45, 170)">
    <!-- DS18B20 -->
    <rect x="0" y="0" width="280" height="65" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="15" y="24" fill="#f8fafc" font-size="13" font-weight="bold">DS18B20 Temp Sensor</text>
    <text x="15" y="42" fill="#a7f3d0" font-size="11">1-Wire Bus &bull; GPIO 4 &bull; 4.7k Pull-up</text>
    <text x="15" y="56" fill="#64748b" font-size="10">Non-blocking FSM (750 ms conversion)</text>

    <!-- PIR Motion -->
    <rect x="0" y="75" width="280" height="55" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="15" y="99" fill="#f8fafc" font-size="13" font-weight="bold">HC-SR501 PIR Sensor</text>
    <text x="15" y="117" fill="#a7f3d0" font-size="11">Digital Input &bull; GPIO 27 (Motion Detect)</text>

    <!-- Green Button -->
    <rect x="0" y="140" width="280" height="60" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="15" y="164" fill="#f8fafc" font-size="13" font-weight="bold">Confirmation Push Button</text>
    <text x="15" y="182" fill="#a7f3d0" font-size="11">Active-Low Input &bull; GPIO 13</text>
    <text x="15" y="194" fill="#64748b" font-size="10">Task 3 Critical Dose 2-Factor Auth (5s timeout)</text>

    <!-- Status LEDs -->
    <rect x="0" y="210" width="280" height="85" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="15" y="234" fill="#f8fafc" font-size="13" font-weight="bold">Status Indicator LEDs</text>
    <text x="15" y="252" fill="#ef4444" font-size="11">&bull; RED (GPIO 25): Critical (&gt;80 mg/hr)</text>
    <text x="15" y="268" fill="#eab308" font-size="11">&bull; YELLOW (GPIO 26): Warning (80 mg/hr)</text>
    <text x="15" y="284" fill="#22c55e" font-size="11">&bull; GREEN (GPIO 33): Normal (0-79 mg/hr)</text>

    <!-- Buzzer -->
    <rect x="0" y="305" width="280" height="65" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="15" y="329" fill="#f8fafc" font-size="13" font-weight="bold">Piezo Buzzer (1200 Hz Tone)</text>
    <text x="15" y="347" fill="#a7f3d0" font-size="11">PWM Output &bull; GPIO 14</text>
    <text x="15" y="361" fill="#64748b" font-size="10">Priority Cadences: Critical / Wi-Fi / MQTT</text>

    <!-- OLED -->
    <rect x="0" y="380" width="280" height="80" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="15" y="404" fill="#f8fafc" font-size="13" font-weight="bold">SSD1306 128x64 I2C OLED</text>
    <text x="15" y="422" fill="#a7f3d0" font-size="11">I2C: GPIO 21 (SDA), GPIO 22 (SCL)</text>
    <text x="15" y="437" fill="#64748b" font-size="10">Medication Live Status (y: 0..44)</text>
    <text x="15" y="451" fill="#64748b" font-size="10">Task 6 LOGGING OFFLINE Banner (y: 54..63)</text>

    <!-- SG90 Servo -->
    <rect x="0" y="470" width="280" height="65" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="15" y="494" fill="#f8fafc" font-size="13" font-weight="bold">SG90 Micro-Servo Motor</text>
    <text x="15" y="512" fill="#a7f3d0" font-size="11">PWM Slew Output &bull; GPIO 18</text>
    <text x="15" y="526" fill="#64748b" font-size="10">Bed Angles: 10° Rest, 45° Resp, 90° Emer</text>

    <!-- ESP32 Board Spec -->
    <rect x="0" y="545" width="280" height="135" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="15" y="568" fill="#6ee7b7" font-size="12" font-weight="bold">ESP32 DevKit v4 SoC Specs</text>
    <text x="15" y="586" fill="#ecfdf5" font-size="11">&bull; Dual Tensilica Xtensa LX6 @ 240 MHz</text>
    <text x="15" y="602" fill="#ecfdf5" font-size="11">&bull; 320 KB SRAM (15.1% utilized / 49.4 KB)</text>
    <text x="15" y="618" fill="#ecfdf5" font-size="11">&bull; 4 MB Flash (79.9% utilized / 1.04 MB)</text>
    <text x="15" y="634" fill="#ecfdf5" font-size="11">&bull; Hardware TWDT (8000 ms panic)</text>
    <text x="15" y="650" fill="#ecfdf5" font-size="11">&bull; 0 ms Blocking delay() &bull; 100% Non-blocking</text>
  </g>

  <!-- ESP32 FreeRTOS Core 1: Application Tasks (Center Column) -->
  <rect x="360" y="105" width="650" height="785" rx="12" fill="url(#cardCore1)" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="375" y="120" width="620" height="35" rx="8" fill="#1e40af"/>
  <text x="390" y="143" fill="#93c5fd" font-size="14" font-weight="bold">CORE 1: FreeRTOS APPLICATION SCHEDULER &amp; IPC PIPELINE</text>

  <!-- Supervisor Tier -->
  <rect x="375" y="165" width="620" height="55" rx="8" fill="#1e293b" stroke="#e11d48" stroke-width="1.5"/>
  <text x="390" y="188" fill="#fda4af" font-size="13" font-weight="bold">watchdogTask [Priority 5] (Cadence: 6000 ms)</text>
  <text x="390" y="206" fill="#94a3b8" font-size="11">Audits task heartbeats (lastHeartbeatMs) &bull; Flags SYSTEM_DEGRADED &bull; ESP-IDF TWDT (8000 ms hardware panic)</text>

  <!-- Alert Tier -->
  <rect x="375" y="228" width="620" height="48" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="390" y="250" fill="#fde68a" font-size="13" font-weight="bold">alertTask [Priority 4] (Binary Semaphore Triggered)</text>
  <text x="390" y="266" fill="#94a3b8" font-size="11">Dispatches clinical/facility rising-edge anomalies to Serial and coordinates alert states</text>

  <!-- Sensor & Telemetry Tier -->
  <g transform="translate(375, 284)">
    <rect x="0" y="0" width="300" height="60" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="12" y="22" fill="#93c5fd" font-size="12" font-weight="bold">vitalSensorTask [P3]</text>
    <text x="12" y="38" fill="#60a5fa" font-size="10">PPG Heart Rate &amp; SpO2</text>
    <text x="12" y="50" fill="#64748b" font-size="9">Adaptive Cadence (5s / 30s / 60s)</text>

    <rect x="320" y="0" width="300" height="60" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="332" y="22" fill="#93c5fd" font-size="12" font-weight="bold">ecgTask [P3]</text>
    <text x="332" y="38" fill="#60a5fa" font-size="10">Cardiac Gaussian Model</text>
    <text x="332" y="50" fill="#64748b" font-size="9">Fixed 5 Hz Cadence (200 ms)</text>

    <rect x="0" y="68" width="300" height="60" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="12" y="90" fill="#93c5fd" font-size="12" font-weight="bold">temperatureTask [P2]</text>
    <text x="12" y="106" fill="#60a5fa" font-size="10">DS18B20 1-Wire FSM</text>
    <text x="12" y="118" fill="#64748b" font-size="9">IDLE -&gt; CONVERT (750 ms non-blocking)</text>

    <rect x="320" y="68" width="300" height="60" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="332" y="90" fill="#93c5fd" font-size="12" font-weight="bold">motionTask [P2]</text>
    <text x="332" y="106" fill="#60a5fa" font-size="10">PIR Motion Detector</text>
    <text x="332" y="118" fill="#64748b" font-size="9">Cadence: 1000 ms periodic</text>

    <rect x="0" y="136" width="300" height="60" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="12" y="158" fill="#93c5fd" font-size="12" font-weight="bold">environmentTask [P2]</text>
    <text x="12" y="174" fill="#60a5fa" font-size="10">Room Temp, Oxygen %, AQI</text>
    <text x="12" y="186" fill="#64748b" font-size="9">Simulated + UART CLI override</text>

    <rect x="320" y="136" width="300" height="60" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="332" y="158" fill="#93c5fd" font-size="12" font-weight="bold">samplingTask [P2]</text>
    <text x="332" y="174" fill="#60a5fa" font-size="10">Adaptive Cadence Manager</text>
    <text x="332" y="186" fill="#64748b" font-size="9">Normal: 30s | Critical: 5s</text>
  </g>

  <!-- Actuation & Control Tier -->
  <g transform="translate(375, 490)">
    <rect x="0" y="0" width="300" height="65" rx="8" fill="#0f172a" stroke="#ec4899" stroke-width="1"/>
    <text x="12" y="22" fill="#fbcfe8" font-size="12" font-weight="bold">medicationTask [P3] (50 Hz / 20 ms)</text>
    <text x="12" y="38" fill="#f472b6" font-size="10">Task 3 Safety Slew (+10 mg/h/s)</text>
    <text x="12" y="50" fill="#94a3b8" font-size="9">Interlock: &gt;80 mg/h needs Button Confirm</text>

    <rect x="320" y="0" width="300" height="65" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
    <text x="332" y="22" fill="#cffafe" font-size="12" font-weight="bold">bedTask [P2] (50 Hz / 20 ms)</text>
    <text x="332" y="38" fill="#22d3ee" font-size="10">Task 4 Smooth Microsecond Slew</text>
    <text x="332" y="50" fill="#94a3b8" font-size="9">Auto: 10° Rest, 45° Resp, 90° Emergency</text>

    <rect x="0" y="73" width="300" height="60" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="12" y="95" fill="#ddd6fe" font-size="12" font-weight="bold">displayTask [P1] (100 ms)</text>
    <text x="12" y="111" fill="#a78bfa" font-size="10">SSD1306 OLED via I2C</text>
    <text x="12" y="123" fill="#94a3b8" font-size="9">Drains sensorQueue &amp; renders UI</text>

    <rect x="320" y="73" width="300" height="60" rx="8" fill="#0f172a" stroke="#eab308" stroke-width="1"/>
    <text x="332" y="95" fill="#fef08a" font-size="12" font-weight="bold">serialCliTask [P1] (UART 115200)</text>
    <text x="332" y="111" fill="#facc15" font-size="10">Diagnostic Simulation Console</text>
    <text x="332" y="123" fill="#94a3b8" font-size="9">SET_HR, SET_SPO2, SIM_OFFLINE</text>
  </g>

  <!-- Thread-Safe IPC Bus Container -->
  <rect x="375" y="635" width="620" height="115" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <text x="390" y="656" fill="#38bdf8" font-size="12" font-weight="bold">THREAD-SAFE INTER-TASK COMMUNICATION (IPC) PRIMITIVES</text>
  
  <rect x="390" y="666" width="135" height="32" rx="6" fill="#1e293b" stroke="#0369a1"/>
  <text x="400" y="686" fill="#e0f2fe" font-size="10">vitalsMutex (Mutex)</text>

  <rect x="535" y="666" width="145" height="32" rx="6" fill="#1e293b" stroke="#0369a1"/>
  <text x="545" y="686" fill="#e0f2fe" font-size="10">sensorQueue (10 items)</text>

  <rect x="690" y="666" width="145" height="32" rx="6" fill="#1e293b" stroke="#0369a1"/>
  <text x="700" y="686" fill="#e0f2fe" font-size="10">dosageQueue (5 items)</text>

  <rect x="845" y="666" width="135" height="32" rx="6" fill="#1e293b" stroke="#0369a1"/>
  <text x="855" y="686" fill="#e0f2fe" font-size="10">bedAngleQueue (5)</text>

  <rect x="390" y="706" width="175" height="32" rx="6" fill="#1e293b" stroke="#0369a1"/>
  <text x="400" y="726" fill="#e0f2fe" font-size="10">samplingRateQueue (5 items)</text>

  <rect x="575" y="706" width="175" height="32" rx="6" fill="#1e293b" stroke="#0369a1"/>
  <text x="585" y="726" fill="#e0f2fe" font-size="10">alertSemaphore (Binary)</text>

  <rect x="760" y="706" width="220" height="32" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="770" y="726" fill="#fef3c7" font-size="10">offlineBuffer (64 items RAM FIFO)</text>

  <!-- Network / Cloud Layer (Right Column) -->
  <rect x="1030" y="105" width="340" height="785" rx="12" fill="url(#cardCloud)" stroke="#9333ea" stroke-width="1.5"/>
  <rect x="1045" y="120" width="310" height="35" rx="8" fill="#6b21a8"/>
  <text x="1060" y="143" fill="#e9d5ff" font-size="14" font-weight="bold">CORE 0 &amp; CLOUD TRANSPORT</text>

  <!-- Core 0 Stacks -->
  <g transform="translate(1045, 165)">
    <rect x="0" y="0" width="310" height="75" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
    <text x="15" y="24" fill="#f3e8ff" font-size="13" font-weight="bold">CORE 0: Network Coprocessor</text>
    <text x="15" y="44" fill="#d8b4fe" font-size="11">&bull; Espressif 802.11 b/g/n Wi-Fi MAC/PHY</text>
    <text x="15" y="60" fill="#d8b4fe" font-size="11">&bull; lwIP IPv4/TCP Protocol Stack</text>

    <!-- mqttTask (Core 1 bridge) -->
    <rect x="0" y="85" width="310" height="120" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="15" y="108" fill="#c7d2fe" font-size="13" font-weight="bold">mqttTask [Priority 2] (3000 ms)</text>
    <text x="15" y="126" fill="#a5b4fc" font-size="11">&bull; PubSubClient MQTT v3.1.1</text>
    <text x="15" y="142" fill="#a5b4fc" font-size="11">&bull; Round-Robin Rate Limiting (Adafruit IO)</text>
    <text x="15" y="158" fill="#a5b4fc" font-size="11">&bull; Exponential Backoff Reconnect (2s-&gt;60s)</text>
    <text x="15" y="174" fill="#a5b4fc" font-size="11">&bull; FIFO Replay Engine from offlineBuffer</text>
    <text x="15" y="190" fill="#a5b4fc" font-size="11">&bull; 60-Second Telemetry Aggregator Summary</text>

    <!-- Adafruit IO Feeds -->
    <rect x="0" y="215" width="310" height="495" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
    <text x="15" y="238" fill="#e9d5ff" font-size="13" font-weight="bold">Adafruit IO Cloud Feeds (10 Limit)</text>

    <!-- Medical Feeds -->
    <rect x="12" y="248" width="286" height="85" rx="6" fill="#1e293b" stroke="#3b82f6"/>
    <text x="22" y="268" fill="#93c5fd" font-size="11" font-weight="bold">Medical Staff Dashboard Feeds:</text>
    <text x="22" y="285" fill="#bfdbfe" font-size="10">&bull; hospital-heart-rate (50-100 BPM gauge)</text>
    <text x="22" y="300" fill="#bfdbfe" font-size="10">&bull; hospital-spo2 (92-100 % gauge)</text>
    <text x="22" y="315" fill="#bfdbfe" font-size="10">&bull; hospital-body-temp (36-38 °C gauge)</text>

    <!-- Facility Feeds -->
    <rect x="12" y="340" width="286" height="85" rx="6" fill="#1e293b" stroke="#10b981"/>
    <text x="22" y="360" fill="#6ee7b7" font-size="11" font-weight="bold">Facility Management Dashboard Feeds:</text>
    <text x="22" y="377" fill="#a7f3d0" font-size="10">&bull; hospital-room-temp (18-28 °C gauge)</text>
    <text x="22" y="392" fill="#a7f3d0" font-size="10">&bull; hospital-room-oxygen (19.5-24 % gauge)</text>
    <text x="22" y="407" fill="#a7f3d0" font-size="10">&bull; hospital-air-quality (0-100 AQI gauge)</text>

    <!-- Control Feeds -->
    <rect x="12" y="432" width="286" height="85" rx="6" fill="#1e293b" stroke="#f59e0b"/>
    <text x="22" y="452" fill="#fde68a" font-size="11" font-weight="bold">Interactive Control Feeds (Sliders):</text>
    <text x="22" y="469" fill="#fef08a" font-size="10">&bull; hospital-dosage (0-100 mg/hr control)</text>
    <text x="22" y="484" fill="#fef08a" font-size="10">&bull; hospital-bed-angle (0-90° bed slider)</text>
    <text x="22" y="499" fill="#fef08a" font-size="10">&bull; hospital-sampling-rate (5-60 s slider)</text>

    <!-- Events Feed -->
    <rect x="12" y="524" width="286" height="175" rx="6" fill="#1e293b" stroke="#ef4444"/>
    <text x="22" y="544" fill="#fca5a5" font-size="11" font-weight="bold">Multiplexed Event Stream Feed:</text>
    <text x="22" y="561" fill="#fecaca" font-size="10">&bull; hospital-events (Stream &amp; Feed View)</text>
    <text x="22" y="578" fill="#94a3b8" font-size="9">  - Clinical Alarms (Tachycardia, Hypoxia)</text>
    <text x="22" y="594" fill="#94a3b8" font-size="9">  - Facility Alarms (High Temp, Low O2, Smoke)</text>
    <text x="22" y="610" fill="#94a3b8" font-size="9">  - Medication Confirmations (&gt;80 mg/hr)</text>
    <text x="22" y="626" fill="#94a3b8" font-size="9">  - Bed Mode Transitions (Emergency, Support)</text>
    <text x="22" y="642" fill="#94a3b8" font-size="9">  - Network Failures (Wi-Fi, MQTT loss)</text>
    <text x="22" y="658" fill="#94a3b8" font-size="9">  - 60-Second Periodic Aggregation Insights</text>
  </g>
</svg>