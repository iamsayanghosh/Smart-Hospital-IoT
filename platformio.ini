; ============================================================================
; PlatformIO Project Configuration: ESP32 Smart Hospital IoT System
; Target Hardware: Espressif ESP32 Dev Module (Xtensa Dual-Core 240 MHz, 320 KB SRAM)
; Framework: Arduino ESP32 Core 3.x / ESP-IDF 5.x
; ============================================================================

[platformio]
src_dir = src
include_dir = include
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 55.3.39
platform_packages =
    framework-arduinoespressif32 @ 3.3.9
board = esp32dev
framework = arduino
monitor_speed = 115200 ; Matches firmware Serial CLI UART baud rate (115200 baud)
test_ignore = * ; Unit tests run under [env:esp32dev_test] so Wokwi .pio/build/esp32dev/firmware.bin stays clean

; Exact pinned library dependencies (unpinned names listed in libraries.txt for Wokwi Web)
lib_deps =
    paulstoffregen/OneWire @ 2.3.8
    milesburton/DallasTemperature @ 4.0.6
    adafruit/Adafruit GFX Library @ 1.13.0
    adafruit/Adafruit SSD1306 @ 2.5.17
    adafruit/Adafruit BusIO @ 1.17.4
    knolleary/PubSubClient @ 2.8.0
    madhephaestus/ESP32Servo @ 3.2.1

[env:esp32dev_test]
platform = ${env:esp32dev.platform}
platform_packages = ${env:esp32dev.platform_packages}
board = ${env:esp32dev.board}
framework = ${env:esp32dev.framework}
monitor_speed = ${env:esp32dev.monitor_speed}
test_framework = unity
test_build_src = no ; test/test_main.cpp defines its own thresholds — do not compile src/ alongside tests
lib_deps =
    ${env:esp32dev.lib_deps}
    throwtheswitch/Unity @ 2.6.1
