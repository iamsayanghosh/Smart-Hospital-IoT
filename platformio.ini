; ============================================================================
; PlatformIO Project Configuration: ESP32 Smart Hospital IoT System
; Target Hardware: Espressif ESP32 Dev Module (Xtensa Dual-Core 240 MHz, 320 KB SRAM)
; Framework: Arduino ESP32 Core 3.x / ESP-IDF 5.x
; ============================================================================

[platformio]
src_dir = src
include_dir = include

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200 ; Matches firmware Serial CLI UART baud rate (115200 baud)

; Exact pinned library dependencies (mirrored in libraries.txt for Wokwi Web)
lib_deps =
    paulstoffregen/OneWire @ 2.3.8
    milesburton/DallasTemperature @ 4.0.6
    adafruit/Adafruit GFX Library @ 1.13.0
    adafruit/Adafruit SSD1306 @ 2.5.17
    knolleary/PubSubClient @ 2.8.0
    madhephaestus/ESP32Servo @ 3.2.1
